<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dbexplore</title>
<link rel="icon" href="favicon.svg">
<style>
  :root { color-scheme: dark; }
  body { margin: 0; height: 100vh; display: grid; place-items: center; background: #1E1F22; color: #DFE1E5; font: 13px Inter, system-ui, sans-serif; }
  form { background: #2B2D30; border: 1px solid #393B40; border-radius: 10px; padding: 28px 28px 24px; width: min(320px, calc(100vw - 32px)); box-sizing: border-box; box-shadow: 0 10px 40px rgba(0,0,0,.45); }
  h1 { font-size: 15px; font-weight: 600; margin: 0 0 18px; display: flex; align-items: center; gap: 10px; }
  .logo { width: 22px; height: 22px; border-radius: 6px; background: linear-gradient(135deg, #3574F0, #2AACB8); display: grid; place-items: center; font-size: 10px; font-weight: 700; color: #fff; }
  label { display: block; color: #868A91; margin-bottom: 6px; }
  input { width: 100%; box-sizing: border-box; background: #1E1F22; border: 1px solid #4E5157; border-radius: 4px; color: #DFE1E5; padding: 7px 9px; font: inherit; outline: none; }
  input:focus { border-color: #3574F0; box-shadow: 0 0 0 2px rgba(53,116,240,.35); }
  button { margin-top: 16px; width: 100%; background: #3574F0; color: #fff; border: 0; border-radius: 4px; padding: 7px; font: inherit; font-weight: 500; cursor: pointer; }
  button:hover { background: #4682FA; }
  .err { color: #F75464; margin-top: 10px; min-height: 16px; }
</style>
</head>
<body>
<form method="post" action="/login">
  <h1><span class="logo">DB</span>dbexplore</h1>
  <label for="pw">Password</label>
  <input id="pw" name="password" type="password" autofocus autocomplete="current-password">
  <button type="submit">Sign in</button>
  <div class="err" id="err"></div>
</form>
<script>
  if (location.search.includes('failed')) document.getElementById('err').textContent = 'Wrong password';
</script>
</body>
</html>
